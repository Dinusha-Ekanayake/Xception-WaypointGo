server.port=8080
server.tomcat.max-http-form-post-size=4MB
server.tomcat.max-swallow-size=4MB

# Datasource is built by DataConfig from DATABASE_URL so pooled (Neon) and
# plain (local postgres) URLs both work. These are fallbacks for local dev.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=10000

# Never migrate or seed on boot / on requests. Use CLI: migrate | seed.
app.migrate-on-boot=false
app.data-dir=${DATA_DIR:../data}
app.migrations-dir=${MIGRATIONS_DIR:../migrations}
app.public-dir=${PUBLIC_DIR:../frontend/public}
app.calendar-file=${CALENDAR_FILE:}
app.demo-mode=${DEMO_MODE:0}
app.demo-now=${DEMO_NOW:2026-02-13T15:30:00+05:30}
app.seed-password=${SEED_PASSWORD:}
app.cookie-secure=${COOKIE_SECURE:0}

logging.level.com.waypoint=WARN
