# Tests speak plain HTTP through MockMvc, so they use the cookie name and flags
# of local development rather than the HTTPS-only default.
app.cookie-secure=0
# No background delivery in tests: an event reaches a consumer only when a test
# asks the relay to deliver, so no test changes state under another.
app.relay.enabled=false
# The test run keeps one application context, and so one pool, per integration
# test class. Idle pools give their connections back, or a dozen of them exhaust
# PostgreSQL's max_connections ("sorry, too many clients already").
spring.datasource.hikari.minimum-idle=0
