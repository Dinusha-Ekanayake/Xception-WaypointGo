# Tests speak plain HTTP through MockMvc, so they use the cookie name and flags
# of local development rather than the HTTPS-only default.
app.cookie-secure=0
# No background delivery in tests: an event reaches a consumer only when a test
# asks the relay to deliver, so no test changes state under another.
app.relay.enabled=false
# Scheduled jobs must not open the application pool before migrations create its role.
app.scheduling.enabled=false

# Spring caches one application context per distinct test configuration, and
# each keeps its whole pool open. At the production size of 8, thirteen cached
# contexts need 104 connections, more than PostgreSQL's default of 100 (local
# and in CI), and the last ones fail with "too many clients". Five per context
# still covers the two-thread concurrency tests, each holding a transaction while
# a contract read borrows another.
spring.datasource.hikari.maximum-pool-size=5
# And an idle context gives its connections back, so the total does not grow
# with every test class added.
spring.datasource.hikari.minimum-idle=0
# No background plan generation either: a queued Generate runs only when a test
# calls PlanGenerationWorker.runPending() (R-PLN-41).
app.planning.worker.enabled=false
