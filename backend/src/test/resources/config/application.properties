# Tests speak plain HTTP through MockMvc, so they use the cookie name and flags
# of local development rather than the HTTPS-only default.
app.cookie-secure=0

# Spring caches one application context per distinct test configuration, and
# each keeps its whole pool open. At the production size of 8, thirteen cached
# contexts need 104 connections, more than PostgreSQL's default of 100 (local
# and in CI), and the last ones fail with "too many clients". Five per context
# still covers the two-thread concurrency tests, each holding a transaction while
# a contract read borrows another.
spring.datasource.hikari.maximum-pool-size=5

# The relay is driven by hand in tests; a background one would deliver events
# in the middle of an assertion and run real consumers on fabricated payloads.
app.outbox.enabled=false
