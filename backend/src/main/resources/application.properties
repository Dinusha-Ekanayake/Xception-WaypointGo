server.port=${SERVER_PORT:8080}
server.tomcat.max-http-form-post-size=4MB
server.tomcat.max-swallow-size=4MB
# Trust X-Forwarded-For/-Proto only from private-network proxies (nginx, the Next
# proxy), so the sign-in throttle and the audit log see the client, not the proxy.
server.forward-headers-strategy=native

# The datasource is built by DataConfig from app.database-url, so pooled (Neon)
# and plain local URLs both work. The pool connects as waypoint_app, which is
# NOINHERIT: every transaction must adopt a module role before touching a table.
app.database-url=${DATABASE_URL:}
# The owner's connection, read only by `migrate`. Unset, DATABASE_URL does both.
app.migration-database-url=${MIGRATION_DATABASE_URL:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:8}

# Unknown paths reach the handler and come back as problem+json rather than the
# default error page, because the error body is part of the API contract.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Reference data source, read by the reference data module when it lands.
app.data-dir=${DATA_DIR:../data}
app.migrations-dir=${MIGRATIONS_DIR:../migrations}

# Observability. Structured logging stays off locally so logs remain readable;
# set LOG_FORMAT=ecs in a deployed environment to emit JSON.
logging.structured.format.console=${LOG_FORMAT:}
# Optional log file, for the log store to collect when the backend runs natively
# (docs/development-docs/development.md "Searching logs"). Always ECS JSON, so the
# console can stay readable while the file stays parseable. Unset means no file.
logging.file.name=${LOG_FILE:}
logging.structured.format.file=ecs
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoints.web.base-path=/
# Liveness and readiness are separate on purpose: a slow or absent database must
# not get the process killed, it must stop receiving traffic. Readiness includes
# the database; liveness deliberately does not.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
# Component details (the database message) only for an authorized caller. There is
# no actuator authentication, so in practice: status only.
management.endpoint.health.group.readiness.show-details=when-authorized
management.metrics.tags.application=waypoint-dispatch

# Tracing. Trace ids are always generated and logged; export is off unless
# OTLP_EXPORT=true and OTLP_ENDPOINT are both set, so an instance with no collector
# does not fail an export every few seconds. Validated in AppProperties.
app.observability.otlp-export=${OTLP_EXPORT:false}
app.observability.otlp-endpoint=${OTLP_ENDPOINT:}
app.observability.sample-probability=${TRACE_SAMPLE:0.1}
management.otlp.tracing.export.enabled=${app.observability.otlp-export}
management.otlp.tracing.endpoint=${app.observability.otlp-endpoint}
management.tracing.sampling.probability=${app.observability.sample-probability}
# Correlation id and trace id on every plain console line. ECS output carries both
# as fields already.
logging.pattern.correlation=[%X{correlationId:-},%X{traceId:-}]

# Sessions, sign-in throttle and request size. Defaults are the documented policy;
# see EDGE-CASES SEC-05 and SEC-08.
app.session.absolute-lifetime=${SESSION_ABSOLUTE_LIFETIME:12h}
app.session.idle-lifetime=${SESSION_IDLE_LIFETIME:2h}
app.session.touch-interval=${SESSION_TOUCH_INTERVAL:1m}
app.login-throttle.max-failures=${LOGIN_MAX_FAILURES:8}
app.login-throttle.address-max-failures=${LOGIN_ADDRESS_MAX_FAILURES:40}
app.login-throttle.identity-max-failures=${LOGIN_IDENTITY_MAX_FAILURES:40}
app.login-throttle.window=${LOGIN_THROTTLE_WINDOW:15m}
app.http.max-body-bytes=${MAX_BODY_BYTES:4194304}

# RFC 9457 type prefix. A URN until the public documentation host exists.
app.problem-type-base=${PROBLEM_TYPE_BASE:urn:waypoint:problem:}

# The warehouse is an external system. The key is a backend secret and never
# reaches a browser bundle. See docs/architecture/RULES-AND-POLICIES.md section 2.
app.warehouse.base-url=${WAREHOUSE_BASE_URL:https://triathon-warehouse-simple.vercel.app/api/v1}
app.warehouse.api-key=${WAREHOUSE_API_KEY:}
# Placement budget: a store manager is waiting, so 2 s (MODULES contract table).
app.warehouse.timeout-ms=${WAREHOUSE_TIMEOUT_MS:2000}
app.warehouse.catalogue-stale-after=${WAREHOUSE_CATALOGUE_STALE_AFTER:2h}
# HMAC secret for the inbound webhook. Blank turns the webhook off; polling covers it.
app.warehouse.webhook-secret=${WAREHOUSE_WEBHOOK_SECRET:}

# Scheduled jobs (cutoff, warehouse sync and retries). Tests turn this off.
app.scheduling.enabled=${SCHEDULING_ENABLED:true}

# On unless told otherwise. Local development over plain HTTP sets COOKIE_SECURE=0.
app.cookie-secure=${COOKIE_SECURE:1}
# Origins a state-changing request may come from, beyond the host it was sent to.
# Comma separated, for example https://dispatch.example.com. Usually left empty.
app.allowed-origins=${ALLOWED_ORIGINS:}

# Docks per depot. Loading spreads a depot's trips over them in departure order.
# Override one depot with app.loading.docks[DEPOT_CODE]=2 in deployment configuration.
app.loading.docks-per-depot=${LOADING_DOCKS_PER_DEPOT:4}
app.loading.fixture-enabled=${LOADING_FIXTURE_ENABLED:false}
logging.level.com.waypoint=INFO

# Outbox relay: delivers committed events to their subscribers (issue #6). Tests
# turn it off and drive delivery themselves. Defaults are in RelayProperties.
app.relay.enabled=${RELAY_ENABLED:true}
app.relay.poll-interval=${RELAY_POLL_INTERVAL:1s}
app.relay.batch-size=${RELAY_BATCH_SIZE:20}
app.relay.max-attempts=${RELAY_MAX_ATTEMPTS:8}
