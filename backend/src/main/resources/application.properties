server.port=${SERVER_PORT:8080}
server.tomcat.max-http-form-post-size=4MB
server.tomcat.max-swallow-size=4MB

# The datasource is built by DataConfig from app.database-url, so pooled (Neon)
# and plain local URLs both work. The pool connects as waypoint_app, which is
# NOINHERIT: every transaction must adopt a module role before touching a table.
app.database-url=${DATABASE_URL:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:8}

# Unknown paths reach the handler and come back as problem+json rather than the
# default error page, because the error body is part of the API contract.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Reference data source, read by the reference data module when it lands.
app.data-dir=${DATA_DIR:../data}
app.migrations-dir=${MIGRATIONS_DIR:../migrations}

# Observability. Structured logging stays off locally so logs remain readable;
# set LOG_FORMAT=ecs in a deployed environment to emit JSON.
logging.structured.format.console=${LOG_FORMAT:}
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoints.web.base-path=/
# Liveness and readiness are separate on purpose: a slow or absent database must
# not get the process killed, it must stop receiving traffic. Readiness includes
# the database; liveness deliberately does not.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.readiness.show-details=always
management.metrics.tags.application=waypoint-dispatch
management.tracing.sampling.probability=${TRACE_SAMPLE:1.0}
management.otlp.tracing.endpoint=${OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}

# The warehouse is an external system. The key is a backend secret and never
# reaches a browser bundle. See docs/architecture/RULES-AND-POLICIES.md section 2.
app.warehouse.base-url=${WAREHOUSE_BASE_URL:https://triathon-warehouse-simple.vercel.app/api/v1}
app.warehouse.api-key=${WAREHOUSE_API_KEY:}
app.warehouse.timeout-ms=${WAREHOUSE_TIMEOUT_MS:3000}

app.cookie-secure=${COOKIE_SECURE:0}
logging.level.com.waypoint=INFO
