server.port=${SERVER_PORT:8080}
server.tomcat.max-http-form-post-size=4MB
server.tomcat.max-swallow-size=4MB

# The datasource is built by DataConfig from DATABASE_URL, so pooled (Neon) and
# plain local URLs both work. The pool connects as waypoint_app, which is
# NOINHERIT: every transaction must adopt a module role before touching a table.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:8}

# Unknown paths reach the handler and come back as problem+json rather than the
# default error page, because the error body is part of the API contract.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Reference data source, read by the reference data module when it lands.
app.data-dir=${DATA_DIR:../data}
app.migrations-dir=${MIGRATIONS_DIR:../migrations}

# The warehouse is an external system. The key is a backend secret and never
# reaches a browser bundle. See docs/architecture/RULES-AND-POLICIES.md section 2.
app.warehouse.base-url=${WAREHOUSE_BASE_URL:https://triathon-warehouse-simple.vercel.app/api/v1}
app.warehouse.api-key=${WAREHOUSE_API_KEY:}
app.warehouse.timeout-ms=${WAREHOUSE_TIMEOUT_MS:3000}

app.cookie-secure=${COOKIE_SECURE:0}
logging.level.com.waypoint=INFO
