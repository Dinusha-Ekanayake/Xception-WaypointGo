proxy_http_version 1.1;
proxy_set_header Connection "";
# Host goes through untouched: the Next.js proxy forwards it to the backend.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Replaced, not appended: a client-supplied X-Forwarded-For is not trusted.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_hide_header X-Powered-By;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
# The application sets these too; site.conf is the one place they are decided.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
