# Shared by the production and preview servers. The including server sets
# $frontend to its own upstream.

if ($deny_direct) {
  return 444;
}

if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
  return 405;
}

# Headers are set here and nowhere deeper: an add_header inside a location
# would silently drop every one of these for that location.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy same-origin always;
# The driver flow takes proof photos and may read location; nothing else is needed.
add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(self), payment=(), usb=()" always;
# Cloudflare must not rewrite our pages. It injected its analytics script into
# every HTML page, which our Content-Security-Policy then blocked, so each screen
# logged an error (deadline-day UX plan U4). no-transform turns that rewriting
# off; it is added beside whatever Cache-Control the app itself sends.
add_header Cache-Control "no-transform" always;

limit_conn perip 60;

# Dotfiles are never served. The application has none; this is for scanners.
location ~ /\.(?!well-known/) {
  return 404;
}

# Sign-in: ten attempts a minute per address, on top of the per-account
# throttle the backend keeps in PostgreSQL.
location = /api/session {
  limit_req zone=signin burst=5 nodelay;
  limit_req zone=api burst=60 nodelay;
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass $frontend;
}

# The unread-count stream (issue #118): one long response, so it is not
# buffered and may stay open past the usual read timeout.
location = /api/notifications/stream {
  limit_req zone=api burst=60 nodelay;
  include /etc/nginx/snippets/proxy.conf;
  proxy_buffering off;
  proxy_read_timeout 120s;
  proxy_pass $frontend;
}

location /api/ {
  limit_req zone=api burst=60 nodelay;
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass $frontend;
}

# Base map pictures (issue #161). A map view asks for many at once, so they
# share the pages limit; repeats are answered from the cache, not the provider.
location /map-tiles/ {
  limit_req zone=pages burst=150 nodelay;
  include /etc/nginx/snippets/proxy.conf;
  proxy_cache map_tiles;
  proxy_cache_key $request_uri;
  proxy_cache_valid 200 7d;
  proxy_cache_valid 404 502 504 1m;
  proxy_cache_lock on;
  proxy_cache_use_stale error timeout updating;
  proxy_pass $frontend;
}

# Pages and static assets. A first load fetches many files at once, hence the
# larger burst.
location / {
  limit_req zone=pages burst=150 nodelay;
  include /etc/nginx/snippets/proxy.conf;
  proxy_pass $frontend;
}
