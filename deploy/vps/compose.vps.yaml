# VPS overlay, layered over the root compose.yaml for both environments on the
# server: production (the tip of main) and preview (the tip of dev).
#
#   docker compose -f compose.yaml -f deploy/vps/compose.vps.yaml up -d
#
# It changes four things and nothing else. No service publishes a host port, so
# two stacks can run side by side and nothing but nginx is reachable from
# outside. The frontend joins the shared `waypoint-edge` network under an alias
# named after its environment, which is how nginx tells the two apart. The
# session cookie is always Secure, because everything here is behind nginx on
# HTTPS whatever the checkout's .env says.
# And the frontend is built knowing that each role has an address of its own.
#
# Docker publishes ports ahead of ufw, so a port published here is open to the
# internet whatever the firewall says.
#
# nginx and certbot belong to the `edge` profile and run in the production
# stack only; deploy/vps/deploy.sh enables the profile there. Paths are relative
# to the repository root (the first -f file sets the project directory).
# Root .env: SITE_ADDRESS, and DEPLOY_ENV=preview in the preview checkout.
# deploy.sh adds APP_DB_PASSWORD and PROOF_URL_SECRET there the first time they
# are missing.

services:
  db:
    ports: !reset []

  # On the edge network so preview's Prometheus can scrape both environments'
  # /prometheus. nginx never routes to it; the frontend stays the only way in.
  backend:
    ports: !reset []
    environment:
      COOKIE_SECURE: "1"
    networks:
      default:
      edge:
        aliases:
          - ${DEPLOY_ENV:-production}-backend

  waypoint:
    # nginx serves an address per role beside the shared one, so the shared one
    # shows the role landing instead of a sign-in (frontend/src/app-shell/hostRole.ts).
    build:
      args:
        NEXT_PUBLIC_ROLE_ADDRESSES: "1"
    ports: !reset []
    networks:
      default:
      edge:
        aliases:
          - ${DEPLOY_ENV:-production}-waypoint

  # Preview only (the observability profile is enabled by deploy.sh there). nginx
  # reaches it as preview-grafana at grafana.SITE_ADDRESS and
  # grafana-preview.SITE_ADDRESS; the localhost port is dropped like every other.
  grafana:
    ports: !reset []
    environment:
      GF_SECURITY_ADMIN_USER: admin
    networks:
      default:
      edge:
        aliases:
          - preview-grafana

  # Preview only, with the log store. Scrapes production-backend and
  # preview-backend over the edge network (observability/prometheus/vps.yml).
  prometheus:
    volumes:
      - ./observability/prometheus/vps.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      default:
      edge:

  # Host CPU, memory, disk and network for the Prometheus above. Reads the host
  # filesystem read-only; publishes no port.
  node-exporter:
    image: prom/node-exporter:v1.9.0
    profiles: ["observability"]
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped

  nginx:
    build: ./deploy/vps/nginx
    profiles: ["edge"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS to the public hostname}
      # 1 refuses anything that did not come through Cloudflare. Only once the
      # DNS records are proxied.
      CLOUDFLARE_ONLY: ${CLOUDFLARE_ONLY:-0}
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Renews through the webroot nginx serves. First issuance is a one-off run of
  # this service from deploy/vps/deploy.sh. nginx reloads on its own schedule,
  # so certbot never needs the Docker socket.
  certbot:
    image: certbot/certbot:v4.0.0
    profiles: ["edge"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    restart: unless-stopped

networks:
  edge:
    name: waypoint-edge
    external: true

volumes:
  # Certificates and the ACME account key. Losing this volume means re-issuing,
  # and Let's Encrypt rate-limits repeated issuance for the same name.
  letsencrypt:
  certbot-www:
