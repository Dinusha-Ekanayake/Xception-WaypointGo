# VPS overlay, layered over the root compose.yaml for both environments on the
# server: production (the tip of main) and preview (the tip of dev).
#
#   docker compose -f compose.yaml -f deploy/vps/compose.vps.yaml up -d
#
# It changes two things and nothing else. No service publishes a host port, so
# two stacks can run side by side and nothing but Caddy is reachable from
# outside. And the frontend joins the shared `waypoint-edge` network under an
# alias named after its environment, which is how Caddy tells the two apart.
#
# Docker publishes ports ahead of ufw, so a port published here is open to the
# internet whatever the firewall says.
#
# Caddy belongs to the `edge` profile and runs in the production stack only;
# deploy/vps/deploy.sh enables the profile there. Paths are relative to the
# repository root (the first -f file sets the project directory).
# Root .env: SITE_ADDRESS, and DEPLOY_ENV=preview in the preview checkout.

services:
  db:
    ports: !reset []

  backend:
    ports: !reset []

  waypoint:
    ports: !reset []
    networks:
      default:
      edge:
        aliases:
          - ${DEPLOY_ENV:-production}-waypoint

  caddy:
    image: caddy:2-alpine
    profiles: ["edge"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS to the public hostname}
    volumes:
      # The directory, not the file: git replaces the file on every deploy and a
      # single-file mount would keep serving the old one.
      - ./deploy/vps/caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    restart: unless-stopped

networks:
  edge:
    name: waypoint-edge
    external: true

volumes:
  # Certificates and ACME account keys. Losing this volume means re-issuing, and
  # Let's Encrypt rate-limits repeated issuance for the same name.
  caddy-data:
  caddy-config:
