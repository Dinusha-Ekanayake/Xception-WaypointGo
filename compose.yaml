services:
  db:
    labels:
      com.waypoint.logs: "true"
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: waypoint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-testing-only}
      POSTGRES_DB: waypoint
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - waypoint-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waypoint -d waypoint"]
      interval: 5s
      timeout: 5s
      retries: 10
  init:
    labels:
      com.waypoint.logs: "true"
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Schema, reference data and the demo accounts, explicitly and once per start.
    # Each step is idempotent: re-running changes nothing that is already there.
    environment:
      DATABASE_URL: postgresql://waypoint:${POSTGRES_PASSWORD:-local-testing-only}@db:5432/waypoint
      SEED_PASSWORD: ${SEED_PASSWORD:-Waypoint2026!}
    command: ["sh", "/app/compose-init.sh"]
    volumes:
      - ./scripts/compose-init.sh:/app/compose-init.sh:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  backend:
    labels:
      com.waypoint.logs: "true"
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgresql://waypoint:${POSTGRES_PASSWORD:-local-testing-only}@db:5432/waypoint
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      WAREHOUSE_BASE_URL: ${WAREHOUSE_BASE_URL:-https://triathon-warehouse-simple.vercel.app/api/v1}
      WAREHOUSE_API_KEY: ${WAREHOUSE_API_KEY:-}
      WAREHOUSE_TIMEOUT_MS: ${WAREHOUSE_TIMEOUT_MS:-2000}
      WAREHOUSE_CATALOGUE_STALE_AFTER: ${WAREHOUSE_CATALOGUE_STALE_AFTER:-2h}
      WAREHOUSE_WEBHOOK_SECRET: ${WAREHOUSE_WEBHOOK_SECRET:-}
      LOG_FORMAT: ecs
    volumes:
      - ./data:/app/data:ro
      - ./migrations:/app/migrations:ro
      - ./frontend/public:/app/frontend/public:ro
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/readiness | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 5
  waypoint:
    labels:
      com.waypoint.logs: "true"
    build: ./frontend
    ports:
      - "${PORT:-3000}:3000"
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  # ── Log store, opt-in: docker compose --profile observability up -d ──
  # Alloy collects every container labelled com.waypoint.logs=true, plus the
  # natively run backend's var/log/*.log, and ships them to Loki. Grafana is the
  # search page, on 127.0.0.1 only. See docs/development-docs/development.md.
  loki:
    image: grafana/loki:3.4.2
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped
  alloy:
    image: grafana/alloy:v1.7.1
    profiles: ["observability"]
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./var/log:/var/log/waypoint:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.5.2
    profiles: ["observability"]
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-testing-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    restart: unless-stopped
volumes:
  waypoint-postgres:
  loki-data:
  alloy-data:
  grafana-data:
