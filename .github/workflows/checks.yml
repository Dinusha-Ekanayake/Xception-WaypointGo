name: Checks

# The tests every change has to pass. Runs on pull requests into main and dev,
# and is called by the two deploy workflows before they ship anything.
on:
  workflow_call:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

# A newer push to a pull request cancels its older run, so stale runs do not
# hold runners while the current one queues. Deploy runs (workflow_call) are
# never cancelled: each gets its own group.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which areas this change touches. A job whose area is untouched is skipped,
  # so a frontend change does not wait on the backend and a docs change runs
  # nothing. Deploys (workflow_call) and changes to the workflows run everything.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      backend: ${{ steps.areas.outputs.backend }}
      frontend: ${{ steps.areas.outputs.frontend }}
      mcp: ${{ steps.areas.outputs.mcp }}
      ml: ${{ steps.areas.outputs.ml }}
      compose: ${{ steps.areas.outputs.compose }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: areas
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          areas="backend frontend mcp ml compose"
          if [ "${{ github.event_name }}" != pull_request ]; then
            for a in $areas; do echo "$a=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          fi
          files=$(git diff --name-only "$BASE"...HEAD)
          echo "$files"
          all=false
          echo "$files" | grep -q '^\.github/workflows/' && all=true
          hit() { $all && echo true && return; echo "$files" | grep -qE "$1" && echo true || echo false; }
          {
            echo "backend=$(hit '^(backend|migrations|data|tools/check_allocation)/')"
            echo "frontend=$(hit '^frontend/')"
            echo "mcp=$(hit '^mcp/')"
            echo "ml=$(hit '^ml-server/')"
            echo "compose=$(hit '^(compose[^/]*\.yaml|deploy/)|Dockerfile')"
          } | tee -a "$GITHUB_OUTPUT"

  mcp:
    name: Read-only MCP checks
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: docker build -t waypoint-mcp-check .

  ml-server:
    name: Model service tests
    needs: changes
    if: needs.changes.outputs.ml == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ml-server
    steps:
      - uses: actions/checkout@v5
        with:
          # The trained models are in Git LFS; without them the service refuses to start.
          lfs: true
      - uses: actions/setup-python@v6
        with:
          # The version the models were trained on.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-server/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Compares the API with the vendored Datathon inference on real routes.
      - run: pytest

  # Split into shards that run side by side, each on its own runner with its own
  # PostgreSQL, so the integration tests share nothing and need no changes. The
  # shards are balanced by measured time; the last one takes every package the
  # others do not name, so a new test always runs somewhere.
  backend:
    name: Backend tests (${{ matrix.shard.name }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: execution, loading, identity
            tests: "com/waypoint/dispatch/execution/**,com/waypoint/dispatch/loading/**,com/waypoint/dispatch/identity/**"
          - name: notification, issues, receipt
            tests: "com/waypoint/dispatch/notification/**,com/waypoint/dispatch/issues/**,com/waypoint/dispatch/receipt/**"
          - name: planning, messaging
            tests: "com/waypoint/dispatch/planning/**,com/waypoint/dispatch/messaging/**"
            # PeakDayAllocationTest (planning) runs here and writes the Task 2B file.
            validator: true
          - name: everything else
            tests: "!com/waypoint/dispatch/execution/**,!com/waypoint/dispatch/loading/**,!com/waypoint/dispatch/identity/**,!com/waypoint/dispatch/notification/**,!com/waypoint/dispatch/issues/**,!com/waypoint/dispatch/receipt/**,!com/waypoint/dispatch/planning/**,!com/waypoint/dispatch/messaging/**"
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: waypoint
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: waypoint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waypoint -d waypoint_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Without this the integration tests are skipped and the run proves nothing
      # about the database paths.
      TEST_DATABASE_URL: postgresql://waypoint:ci-only@localhost:5432/waypoint_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Unit, architecture and integration tests
        working-directory: backend
        run: mvn -B --no-transfer-progress verify -Dtest="$SHARD_TESTS" -Dsurefire.failIfNoSpecifiedTests=false
        env:
          SHARD_TESTS: ${{ matrix.shard.tests }}
      - if: matrix.shard.validator
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # PeakDayAllocationTest wrote this file in the step above. A planning
      # change that breaks the official scoring rules stops here.
      - name: Official Task 2B validator on the engine's peak-day output (PLN-17)
        if: matrix.shard.validator
        run: |
          pip install --quiet pandas
          test -f backend/target/task2b/submission_task2b.csv
          python tools/check_allocation/check_allocation.py backend/target/task2b/submission_task2b.csv

  # One status named as before, green only when every shard passed, so a branch
  # rule or a reader has a single check to look at.
  backend-result:
    name: Backend tests
    needs: backend
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Skipped means the change does not touch the backend.
      - run: test "${{ needs.backend.result }}" = success || test "${{ needs.backend.result }}" = skipped

  frontend:
    name: Frontend checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # No build here: every browser suite runner builds the same commit.

  # Every role's screens in a real browser (#120), each suite against the
  # production build with its API mocked, so no backend is needed. One runner
  # per suite, side by side, each building for itself: the wall time is the
  # slowest suite rather than the sum. Driver and loader are drawn at 393 px,
  # dispatcher and store at 1440 px (the configs).
  browser:
    name: Browser suite (${{ matrix.suite.name }})
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { name: shell, config: playwright.config.ts }
          # The largest suite, split across two runners.
          - { name: dispatcher 1/2, config: playwright.dispatcher.config.ts, shard: --shard=1/2 }
          - { name: dispatcher 2/2, config: playwright.dispatcher.config.ts, shard: --shard=2/2 }
          - { name: driver, config: playwright.driver.config.ts }
          - { name: loader, config: playwright.loader.config.ts }
          - { name: store, config: playwright.store.config.ts }
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Playwright version
        id: playwright
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      # Restored here and saved at the end even when a suite failed, so a red run
      # does not make the next one download Chromium again.
      - uses: actions/cache/restore@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # The webpack cache of earlier builds, so an unchanged module is not compiled again.
      - uses: actions/cache@v5
        with:
          path: frontend/.next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ github.sha }}
          restore-keys: next-build-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-
      - run: npm run build
      - name: Suite
        run: npx playwright test -c ${{ matrix.suite.config }} ${{ matrix.suite.shard }}
      - name: Keep the reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-suites-report-${{ strategy.job-index }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
      # Several suites may miss the cache at once; the first save wins and the
      # rest fail to save, which is harmless.
      - name: Keep Chromium for the next run
        if: always() && steps.browsers.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

  # One status named as before, green only when every suite passed.
  browser-result:
    name: Browser suites
    needs: browser
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: test "${{ needs.browser.result }}" = success || test "${{ needs.browser.result }}" = skipped

  compose:
    name: Compose files parse
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config -q
      # The VPS overlay, with nginx: what both deployed environments run.
      - run: docker compose -f compose.yaml -f deploy/vps/compose.vps.yaml --profile edge config > vps.yaml
        env:
          SITE_ADDRESS: ci.example.test
      # The role landing depends on this build argument reaching the frontend.
      - run: grep -q 'NEXT_PUBLIC_ROLE_ADDRESSES' vps.yaml
      - run: docker compose -f compose.prod.yaml config -q
        env:
          DOMAIN: ci.example.test
          DATABASE_URL: postgresql://ci@localhost/ci
