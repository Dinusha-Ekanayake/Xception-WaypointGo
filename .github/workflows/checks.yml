name: Checks

# The tests every change has to pass. Runs on pull requests into main and dev,
# and is called by the two deploy workflows before they ship anything.
on:
  workflow_call:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  mcp:
    name: Read-only MCP checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: docker build -t waypoint-mcp-check .

  ml-server:
    name: Model service tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ml-server
    steps:
      - uses: actions/checkout@v5
        with:
          # The trained models are in Git LFS; without them the service refuses to start.
          lfs: true
      - uses: actions/setup-python@v6
        with:
          # The version the models were trained on.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-server/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Compares the API with the vendored Datathon inference on real routes.
      - run: pytest

  # Split into shards that run side by side, each on its own runner with its own
  # PostgreSQL, so the integration tests share nothing and need no changes. The
  # shards are balanced by measured time; the last one takes every package the
  # others do not name, so a new test always runs somewhere.
  backend:
    name: Backend tests (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: execution, loading, identity
            tests: "com/waypoint/dispatch/execution/**,com/waypoint/dispatch/loading/**,com/waypoint/dispatch/identity/**"
          - name: notification, issues, receipt
            tests: "com/waypoint/dispatch/notification/**,com/waypoint/dispatch/issues/**,com/waypoint/dispatch/receipt/**"
          - name: everything else
            tests: "!com/waypoint/dispatch/execution/**,!com/waypoint/dispatch/loading/**,!com/waypoint/dispatch/identity/**,!com/waypoint/dispatch/notification/**,!com/waypoint/dispatch/issues/**,!com/waypoint/dispatch/receipt/**"
            # PeakDayAllocationTest (planning) runs here and writes the Task 2B file.
            validator: true
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: waypoint
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: waypoint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waypoint -d waypoint_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Without this the integration tests are skipped and the run proves nothing
      # about the database paths.
      TEST_DATABASE_URL: postgresql://waypoint:ci-only@localhost:5432/waypoint_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Unit, architecture and integration tests
        working-directory: backend
        run: mvn -B --no-transfer-progress verify -Dtest="$SHARD_TESTS" -Dsurefire.failIfNoSpecifiedTests=false
        env:
          SHARD_TESTS: ${{ matrix.shard.tests }}
      - if: matrix.shard.validator
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # PeakDayAllocationTest wrote this file in the step above. A planning
      # change that breaks the official scoring rules stops here.
      - name: Official Task 2B validator on the engine's peak-day output (PLN-17)
        if: matrix.shard.validator
        run: |
          pip install --quiet pandas
          test -f backend/target/task2b/submission_task2b.csv
          python tools/check_allocation/check_allocation.py backend/target/task2b/submission_task2b.csv

  # One status named as before, green only when every shard passed, so a branch
  # rule or a reader has a single check to look at.
  backend-result:
    name: Backend tests
    needs: backend
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: test "${{ needs.backend.result }}" = success

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    name: Compose files parse
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config -q
      # The VPS overlay, with nginx: what both deployed environments run.
      - run: docker compose -f compose.yaml -f deploy/vps/compose.vps.yaml --profile edge config > vps.yaml
        env:
          SITE_ADDRESS: ci.example.test
      # The role landing depends on this build argument reaching the frontend.
      - run: grep -q 'NEXT_PUBLIC_ROLE_ADDRESSES' vps.yaml
      - run: docker compose -f compose.prod.yaml config -q
        env:
          DOMAIN: ci.example.test
          DATABASE_URL: postgresql://ci@localhost/ci
