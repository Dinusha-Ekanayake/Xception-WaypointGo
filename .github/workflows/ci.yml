name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: waypoint
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: waypoint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waypoint -d waypoint_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://waypoint:ci-only@127.0.0.1:5432/waypoint_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Maven tests, unit and integration
        working-directory: backend
        run: mvn -B test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Official Task 2B validator on the engine's peak-day output (PLN-17)
        run: |
          pip install --quiet pandas
          test -f backend/target/task2b/submission_task2b.csv
          python tools/check_allocation/check_allocation.py backend/target/task2b/submission_task2b.csv

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and typecheck
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
