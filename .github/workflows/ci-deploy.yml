name: Deploy production

# A push to main (a merge) runs the checks and, only if they pass, deploys the
# tip of main to the VPS. The preview of dev is preview-deploy.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # checks.yml asks for it in its release job, which a deploy never runs.
  actions: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    name: Deploy to VPS
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One deploy at a time, and never cancel one halfway through a migration.
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Deploy the tip of main
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key is bound to deploy/vps/deploy.sh on the server by a forced
          # command, so nothing sent from here chooses what runs or what ships.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$VPS_USER@$VPS_HOST" deploy
