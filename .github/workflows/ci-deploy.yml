name: CI and deploy

# Pull requests into main run the checks. A push to main (a merge) runs the same
# checks and, only if they pass, deploys the tip of main to the VPS.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: waypoint
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: waypoint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waypoint -d waypoint_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Without this the integration tests are skipped and the run proves nothing
      # about the database paths.
      TEST_DATABASE_URL: postgresql://waypoint:ci-only@localhost:5432/waypoint_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Unit and integration tests
        working-directory: backend
        run: mvn -B --no-transfer-progress package

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy to VPS
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One deploy at a time, and never cancel one halfway through a migration.
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Deploy the tip of main
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key is bound to deploy/vps/deploy.sh on the server by a forced
          # command, so nothing sent from here chooses what runs or what ships.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$VPS_USER@$VPS_HOST" deploy
