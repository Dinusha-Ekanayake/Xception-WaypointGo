# Production stack: nginx (TLS + routing) -> frontend (Next.js) + backend
# (Spring Boot) -> managed PostgreSQL (Neon). No local database service.
#
# Required environment (see .env.example / docs/deployment.md):
#   DOMAIN            public hostname, DNS pointed at this host
#   CERTBOT_EMAIL     contact for Let's Encrypt expiry notices
#   DATABASE_URL      pooled connection string (app traffic)
#
# Deployment and certificate issuance: see docs/deployment.md.

services:
  nginx:
    labels:
      com.waypoint.logs: "true"
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to the public hostname}
    volumes:
      - certbot-www:/var/www/certbot:ro
      - certs:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

  certbot:
    labels:
      com.waypoint.logs: "true"
    image: certbot/certbot:v2.11.0
    volumes:
      - certbot-www:/var/www/certbot
      - certs:/etc/letsencrypt
    profiles: ["renewal"]
    # Issuance overrides entrypoint; renewal is an explicitly enabled service.
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --deploy-hook 'true'; sleep 12h & wait $${!}; done"]
    restart: unless-stopped

  # Schema and reference data, explicitly, before the backend starts. Both steps
  # are idempotent. Accounts are created with scripts/account.sh, never here.
  init:
    labels:
      com.waypoint.logs: "true"
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the pooled connection string}
    command: ["sh", "-c", "java -jar /app/backend.jar migrate && java -jar /app/backend.jar import-reference"]
    restart: "no"

  backend:
    labels:
      com.waypoint.logs: "true"
    build:
      context: .
      dockerfile: backend/Dockerfile
    expose:
      - "8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the pooled connection string}
      COOKIE_SECURE: "1"
      WAREHOUSE_BASE_URL: ${WAREHOUSE_BASE_URL:-https://triathon-warehouse-simple.vercel.app/api/v1}
      WAREHOUSE_API_KEY: ${WAREHOUSE_API_KEY:-}
      LOG_FORMAT: ecs
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/readiness | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    labels:
      com.waypoint.logs: "true"
    build: ./frontend
    expose:
      - "3000"
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Log store, opt-in: docker compose -f compose.prod.yaml --profile observability up -d ──
  # Grafana listens on 127.0.0.1 only and is reached through an SSH tunnel,
  # never through nginx: logs are operational data, not a public login page.
  # See docs/deployment.md "Logs".
  loki:
    image: grafana/loki:3.4.2
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.7.1
    profiles: ["observability"]
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    profiles: ["observability"]
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    # Refuse to start without a password. Checked here rather than with ${...:?}
    # because Compose interpolates every service, so :? would break the whole
    # stack even with this profile off.
    entrypoint: ["/bin/sh", "-c", "[ -n \"$$GF_SECURITY_ADMIN_PASSWORD\" ] || { echo 'Set GRAFANA_ADMIN_PASSWORD' >&2; exit 1; }; exec /run.sh"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  certbot-www:
  certs:
  loki-data:
  alloy-data:
  grafana-data:
